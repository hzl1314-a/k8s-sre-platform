# =============================================================================
# Loki Helm values —— 适配 chart 7.3.0（Loki 3.6.12），单二进制模式
#
# 安装（在 k8s-cp 上，必须在 kube-prometheus-stack 之后）：
#   helm install loki ./loki-7.3.0.tgz -n monitoring -f loki-values.yaml
#
# 为什么选 Loki 而不是 ELK（面试必答）：
#   Loki 只对标签建索引，日志正文压缩后直接存对象存储/文件系统，
#   资源占用比 ELK 低一个数量级；且与 Grafana 原生集成，查询语法（LogQL）同源。
#   代价是全文检索能力弱于 ES —— 这是明确的取舍，不是"将就"。
#
# 为什么用 singleBinary 模式：
#   3 节点小集群跑不起微服务模式（distributor/ingester/querier 各一套）。
#   singleBinary 把全部组件塞进一个进程，1 副本足够演示。
# =============================================================================

deploymentMode: SingleBinary

loki:
  # 镜像：chart 默认 docker.io/grafana/loki，必须换镜像站
  image:
    registry: docker.m.daocloud.io
    repository: grafana/loki

  # 单机部署不需要多租户
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  limits_config:
    # 日志保留 7 天：够覆盖「压测 → 演练 → 写复盘」的全过程
    retention_period: 168h
    # 限流：防止某个服务刷日志把 Loki 打爆（本身也是可讲的设计）
    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 16
    max_query_series: 5000

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  # ⚠️ 集群没有默认 StorageClass（自建 kubeadm 集群的通病），
  #    所以不挂 PVC，用 emptyDir —— 代价是 Loki Pod 重启会丢历史日志。
  #    日志本身是时效性数据，演示场景可接受。
  #    若要持久化：先装 local-path-provisioner，再把 enabled 改成 true。
  persistence:
    enabled: false

# ---- SingleBinary 模式下，其余模式的组件必须显式置零 ----
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# -----------------------------------------------------------------------------
# 以下组件全部关闭：每一个都会额外拉一个镜像，且对演示没有价值
# -----------------------------------------------------------------------------
# gateway 是 nginx 反代；关掉后 Loki 服务名就是 `loki`，端口 3100
# （Promtail 的 push 地址和 Grafana 数据源地址都按这个写）
gateway:
  enabled: false

# sidecar 用于监听 ConfigMap 热加载规则。它的镜像在 docker.io
# （kiwigrid/k8s-sidecar），渲染验证时发现漏网，必须换源。
sidecar:
  image:
    registry: docker.m.daocloud.io

chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false

monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false     # 这个会装一个 operator，我们不需要
  lokiCanary:
    enabled: false
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
