# =============================================================================
# Loki Helm values —— 适配 chart 7.3.0（Loki 3.6.12），单二进制模式
#
# 安装（在 k8s-cp 上，必须在 kube-prometheus-stack 之后）：
#   helm install loki ./loki-7.3.0.tgz -n monitoring -f loki-values.yaml
#
# 为什么选 Loki 而不是 ELK（面试必答）：
#   Loki 只对标签建索引，日志正文压缩后直接存对象存储/文件系统，
#   资源占用比 ELK 低一个数量级；且与 Grafana 原生集成，查询语法（LogQL）同源。
#   代价是全文检索能力弱于 ES —— 这是明确的取舍，不是"将就"。
#
# 为什么用 singleBinary 模式：
#   3 节点小集群跑不起微服务模式（distributor/ingester/querier 各一套）。
#   singleBinary 把全部组件塞进一个进程，1 副本足够演示。
# =============================================================================

deploymentMode: SingleBinary

loki:
  # 镜像：chart 默认 docker.io/grafana/loki，必须换镜像站
  # 2026-09-13 换源：docker.m.daocloud.io 拉大镜像实测极慢，改用毫秒镜像
  image:
    registry: docker.1ms.run
    repository: grafana/loki

  # 单机部署不需要多租户
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  # ---------------------------------------------------------------------------
  # 保留策略：Loki 默认「永久保留」，要真正删除必须由 compactor 执行
  # ---------------------------------------------------------------------------
  # 三个字段是一个整体，缺一个都不行（Loki 3.x 的硬性要求）：
  #   retention_enabled            —— 不设 true 时 compactor 只做合并、不删除
  #   delete_request_store         —— 启用 retention 时**必须**指定，否则启动报错
  #   limits_config.retention_period —— 实际的保留时长（见下方）
  # working_directory 不能留默认（默认 /data/retention 会失败），指到我们挂了盘的地方
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem
    compaction_interval: 10m
    retention_delete_delay: 2h
    retention_delete_worker_count: 150

  limits_config:
    # 日志保留 7 天：够覆盖「压测 → 演练 → 写复盘」的全过程
    retention_period: 168h
    # 限流：防止某个服务刷日志把 Loki 打爆（本身也是可讲的设计）
    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 16
    max_query_series: 5000

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  # ⚠️ 这里有个必须知道的坑（2026-09-13 实际踩到，Loki 直接 CrashLoopBackOff）：
  #
  #   chart 的 statefulset 模板里，/var/loki 的挂载被 persistence 开关包着：
  #       {{- if .Values.singleBinary.persistence.enabled }}
  #       - name: storage
  #         mountPath: /var/loki
  #       {{- end }}
  #
  #   而 Loki 容器是 runAsUser=10001 / runAsNonRoot=true 运行的，
  #   配置里 path_prefix / chunks_directory 又都指向 /var/loki。
  #   一旦 persistence 关掉且不手工补挂载，容器就没有可写的 /var/loki，
  #   启动时 mkdir 被拒 -> Error -> CrashLoopBackOff。
  #
  #   我们的集群没有默认 StorageClass（自建 kubeadm 的通病），
  #   所以 persistence 保持 false，改用下面的 extraVolumes 手工挂 emptyDir。
  #   代价：Pod 重建会丢历史日志。日志是时效性数据，演示场景可接受。
  #   若要持久化：先装 local-path-provisioner，再把 persistence.enabled 改 true
  #   并删掉下面两个 extra*。
  persistence:
    enabled: false

  extraVolumes:
    - name: storage
      emptyDir: {}

  extraVolumeMounts:
    - name: storage
      mountPath: /var/loki

# ---- SingleBinary 模式下，其余模式的组件必须显式置零 ----
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# -----------------------------------------------------------------------------
# 以下组件全部关闭：每一个都会额外拉一个镜像，且对演示没有价值
# -----------------------------------------------------------------------------
# gateway 是 nginx 反代；关掉后 Loki 服务名就是 `loki`，端口 3100
# （Promtail 的 push 地址和 Grafana 数据源地址都按这个写）
gateway:
  enabled: false

# sidecar 用于监听 ConfigMap 热加载规则。它的镜像在 docker.io
# （kiwigrid/k8s-sidecar），渲染验证时发现漏网，必须换源。
sidecar:
  image:
    registry: docker.1ms.run

chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false

monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false     # 这个会装一个 operator，我们不需要
  lokiCanary:
    enabled: false
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
