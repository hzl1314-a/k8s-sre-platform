# =============================================================================
# Promtail Helm values —— 适配 chart 6.17.1（Promtail 3.5.1）
#
# 安装（在 k8s-cp 上，必须在 kube-prometheus-stack 之后）：
#   helm install promtail ./promtail-6.17.1.tgz -n monitoring -f promtail-values.yaml
#
# Promtail 以 DaemonSet 部署，每个节点一个 Pod：
#   1. 挂载宿主机 /var/log/pods（只读）—— containerd 把容器 stdout/stderr 落在这里
#   2. 通过 Kubernetes API 发现 Pod 元数据，给每行日志打上 namespace/pod/container 标签
#   3. 推送到 Loki 的 push API
#
# 为什么必须挂宿主机目录：容器日志由 kubelet 按 CRI 规范落在宿主机磁盘，
# Promtail 本身跑在容器里，不挂宿主机目录就什么都读不到。这是面试常被追问的实现细节。
# =============================================================================

# -----------------------------------------------------------------------------
# 镜像：chart 默认 docker.io/grafana/promtail，大陆拉不到，必须换镜像站
# -----------------------------------------------------------------------------
image:
  registry: docker.1ms.run
  repository: grafana/promtail
  pullPolicy: IfNotPresent

config:
  # Loki 的 push 地址（SingleBinary 模式且关闭 gateway 后，服务名就是 loki）
  clients:
    - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
      batchwait: 1s
      batchsize: 1048576

  snippets:
    # 给所有日志加一个集群标识，方便日后多集群扩展时区分来源
    extraRelabelConfigs:
      - action: replace
        source_labels: []
        target_label: cluster
        replacement: aliyun-k8s-3node

    # CRI 格式的日志行前面有时间戳和流标记，cri 阶段负责剥离
    pipelineStages:
      - cri: {}

# DaemonSet 必须覆盖所有节点，包括带污点的控制面
tolerations:
  - effect: NoSchedule
    operator: Exists
  - effect: NoExecute
    operator: Exists

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

# 监控 CRD 由 kube-prometheus-stack 提供，所以这个必须装在它之后
serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack

# Promtail 需读取宿主机日志，以 root 运行
podSecurityContext:
  runAsUser: 0
