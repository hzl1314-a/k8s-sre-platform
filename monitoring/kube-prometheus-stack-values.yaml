# =============================================================================
# kube-prometheus-stack Helm values —— 适配 chart 90.1.1（app v0.93.1）
#
# 安装步骤（在 k8s-cp 上）：
#
#   1) 先建 Grafana 管理员 Secret（90.x 移除了 values 里的 adminPassword）
#      kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
#      kubectl -n monitoring create secret generic grafana-admin \
#        --from-literal=admin-user=admin \
#        --from-literal=admin-password='改成你的密码'
#
#   2) 再装 chart
#      helm install kube-prometheus-stack ./kube-prometheus-stack-90.1.1.tgz \
#        -n monitoring --create-namespace \
#        -f kube-prometheus-stack-values.yaml
#
# 这套 chart 一次装齐：Prometheus / Alertmanager / Grafana / node-exporter /
# kube-state-metrics / Prometheus Operator / 100+ 条 K8s 官方告警规则。
#
# ⚠️ 本文件是按 chart 90.1.1 的**实际 values 逐字段核对**后写的，
#    与网上多数教程（针对 5x/6x 版本）有明确差异，不要混用：
#      · grafana.adminPassword 已被移除        → 改用 grafana.admin.existingSecret
#      · alertmanagerSpec 没有 alertmanagerConfigSelectorNilUsesHelmValues
#                                              → 用 alertmanagerConfigSelector: {} 等价
#      · CRD 由子 chart `crds` 管理             → crds.enabled
# =============================================================================

# -----------------------------------------------------------------------------
# CRD：90.x 把 CRD 拆成了独立的子 chart
# -----------------------------------------------------------------------------
crds:
  enabled: true

# =============================================================================
# 镜像：chart 的镜像来自 5 个不同 registry（quay.io / docker.io /
#       registry.k8s.io / ghcr.io），无法用单一 global.imageRegistry 覆盖，
#       必须逐项指定。全部实测在镜像站有缓存。
#       这些 chart 的 tag 大多是模板默认值，所以只需覆盖 registry 一项。
# =============================================================================

prometheus:
  prometheusSpec:
    image:
      registry: quay.m.daocloud.io

    # ---- 最关键的三个开关 ----
    # 默认情况下 Operator 只加载带 release=kube-prometheus-stack 标签的
    # ServiceMonitor / PrometheusRule。我们手写的规则文件不带该标签，
    # 会被**静默忽略**（现象：kubectl apply 成功，但 Prometheus UI 里
    # 什么都看不到，极难排查）。设为 false = 选择器为空 = 匹配所有。
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false

    # 数据保留期：3 节点小集群磁盘有限，15 天足够覆盖「压测 → 演练 → 写复盘」
    retention: 15d
    retentionSize: 8GB
    scrapeInterval: 15s
    evaluationInterval: 15s
    replicas: 1

    resources:
      requests:
        cpu: 300m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi

    # ⚠️ 不挂 PVC：自建 kubeadm 集群没有默认 StorageClass，挂了会一直 Pending。
    #    代价是 Prometheus 重启丢历史指标，演示场景可接受。
    #    要持久化：先装 local-path-provisioner，再打开下面的配置。
    # storageSpec:
    #   volumeClaimTemplate:
    #     spec:
    #       storageClassName: local-path
    #       accessModes: ["ReadWriteOnce"]
    #       resources:
    #         requests:
    #           storage: 10Gi

    podMetadata:
      labels:
        app: prometheus

alertmanager:
  alertmanagerSpec:
    image:
      registry: quay.m.daocloud.io
    # 空选择器 = 匹配所有 AlertmanagerConfig
    # （等价于老教程里的 alertmanagerConfigSelectorNilUsesHelmValues: false，
    #   该字段在 90.x 的 alertmanagerSpec 下已不存在）
    alertmanagerConfigSelector: {}
    alertmanagerConfigNamespaceSelector: {}

    # ★ 2026-09-13 关键修复：不加这一段，我们写在 monitoring 命名空间里的
    #   AlertmanagerConfig **永远不会匹配到 boutique 命名空间的告警**。
    #
    #   原因（这条极隐蔽，务必记牢）：Prometheus Operator 的
    #   `alertmanagerConfigMatcherStrategy.type` **默认值是 `OnNamespace`**
    #   （见 CRD 里的 `default: OnNamespace`）。它的作用是在生成配置时，
    #   给 AlertmanagerConfig 里的**每一条路由**都追加一个
    #   `namespace = <该 AlertmanagerConfig 所在命名空间>` 的匹配条件：
    #     // 摘自 prometheus-operator/pkg/alertmanager/amcfg.go
    #     //   Routes created from AlertmanagerConfig resources should only match
    #     //   alerts that come from the same namespace.
    #     r.Matchers = append(r.Matchers, Matcher{Name: "namespace", Value: crKey.Namespace, ...})
    #
    #   我们的 AlertmanagerConfig 在 `monitoring`，而业务告警的 namespace 是 `boutique`
    #   → 所有规则被追加 `namespace = monitoring` → 业务告警一条都匹配不上我们的路由
    #   → 全部落到 chart 默认根路由的 `null` 接收器上被静默丢弃。
    #   实测症状：告警在 Prometheus 里正常 FIRING、Alertmanager 也收到了，
    #   但邮件与钉钉**一条都不发**；反而 `monitoring` 命名空间的 InfoInhibitor 噪声告警被发了邮件。
    #
    #   三种取值的取舍：
    #     OnNamespace（默认）                            → 每个 AlertmanagerConfig 只管自己命名空间
    #     OnNamespaceExceptForAlertmanagerNamespace      → 同上，但「位于 Alertmanager 所在命名空间的配置」
    #                                                      视为集群级策略、不加限制  ← 本项目用这个
    #     None                                          → 全部不加限制（最省事，但也丢掉了默认保护）
    #
    #   为什么选中间这个而不是 None：我们的 AlertmanagerConfig 恰好就住在 Alertmanager
    #   自己的命名空间（monitoring），这个策略的语义正好是「放在我身边的配置 = 全局策略」——
    #   既让本项目的路由覆盖全集群，又保留了「别的命名空间的 AlertmanagerConfig 仍被限制」的默认保护。
    #
    #   改完必须 helm upgrade 才生效（见本文件开头的安装命令，把 install 换成 upgrade）。
    alertmanagerConfigMatcherStrategy:
      type: OnNamespaceExceptForAlertmanagerNamespace

    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    # storage 同理不挂 PVC

# -----------------------------------------------------------------------------
# Grafana：唯一对外暴露的 Web 界面（NodePort 30300）
# ⚠️ 一定要在阿里云安全组放行 30300，否则公网访问会失败
#    （这个坑我们在 Traefik 的 30800 上踩过一次）
# -----------------------------------------------------------------------------
grafana:
  enabled: true

  image:
    # grafana/grafana 来自 docker.io。
    # 2026-09-13 换源：DaoCloud 的 Docker Hub 镜像站（docker.m.daocloud.io）
    # 拉 grafana 这个大镜像（各层合计约 437MB）实测极慢（10 分钟未完成），
    # 而同一集群拉 quay.m.daocloud.io 的 109MB Prometheus 只需 21 秒。
    # 换成毫秒镜像（商业 SLA，多份 2026 实测榜单中速度与大镜像稳定性均优于 DaoCloud）。
    registry: docker.1ms.run

  sidecar:
    image:
      registry: quay.m.daocloud.io          # kiwigrid/k8s-sidecar 来自 quay.io
    dashboards:
      enabled: true
      searchNamespace: ALL                  # 注意是单数 searchNamespace

  # 90.x 用 Secret 提供管理员密码（adminPassword 已从 values 移除）
  admin:
    existingSecret: grafana-admin

  service:
    type: NodePort
    nodePort: 30300

  # 不持久化：看板通过 sidecar/ConfigMap 提供，本来就不会丢；
  # 手动在 UI 里改的东西重启会丢 —— 这是明确取舍（要持久化先装 StorageClass）
  persistence:
    enabled: false
  initChownData:
    enabled: false
  testFramework:
    enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  grafana.ini:
    analytics:
      reporting_enabled: false
    log:
      level: warn

  # 预置 Loki 数据源：省去手工点界面，也让配置可版本化
  # uid 必须显式写：不指定时 Grafana 会随机生成一个，
  # 自建看板 JSON 里就没法稳定引用（看板是以 uid 引用数据源的）
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      jsonData:
        maxLines: 1000
        timeout: 60

# -----------------------------------------------------------------------------
# 自建 kubeadm 集群的关键取舍
#
# kube-scheduler / kube-controller-manager / etcd 的 metrics 默认只监听
# 127.0.0.1，Prometheus 从 Pod IP 抓取必然失败，Targets 页面会显示一片 DOWN，
# 反而掩盖真正需要关注的目标。这里关闭这三个 ServiceMonitor，
# 专注节点层 + 容器层 + 入口层指标。
# （要抓取需改 /etc/kubernetes/manifests/*.yaml 的 --bind-address=0.0.0.0）
# -----------------------------------------------------------------------------
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: true

nodeExporter:
  enabled: true

prometheus-node-exporter:
  image:
    registry: quay.m.daocloud.io
  hostNetwork: true
  tolerations:
    - operator: Exists
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

kube-state-metrics:
  image:
    registry: k8s.m.daocloud.io            # 这个在 registry.k8s.io
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

prometheusOperator:
  image:
    registry: quay.m.daocloud.io
  # operator 用这个作为「创建 Thanos sidecar 时的默认镜像」。
  # 我们没启用 thanos sidecar（prometheusSpec.thanos 为空），它不会被真正拉取，
  # 但为了不在渲染结果里留下指向 quay.io 的引用，仍显式换源。
  thanosImage:
    registry: quay.m.daocloud.io
    repository: thanos/thanos
  prometheusConfigReloader:
    image:
      registry: quay.m.daocloud.io
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # 关闭 admission webhook：它会额外拉 ghcr.io 的 certgen 镜像，
  # 且自建集群下证书轮换常出问题，演示环境不需要
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false

# 用不到的组件显式关闭（少拉镜像、少占资源）
thanosRuler:
  enabled: false
windowsMonitoring:
  enabled: false

# -----------------------------------------------------------------------------
# 默认规则集：chart 自带 100+ 条 K8s 官方告警规则，是很好的学习材料。
#
# ⚠️ 2026-09-13 修正（演练中实测抓到）：这里原来写着 5 行「禁用某些告警」的配置，
#    它们在 chart 90.1.1 里**全部是无效字段**，helm 不报错、只是静默忽略：
#
#      infoInhibitor / watchdog              → 90.x 的 defaultRules.rules 里没有这两个键了
#      KubeMemoryOvercommit / KubeCPUOvercommit / CPUThrottlingHigh
#                                            → 这几个是**告警名**，不是规则文件键，从来就不该写在这
#
#    90.x 的 defaultRules.rules 只接受「规则文件名」键，完整清单：
#      alertmanager / etcd / configReloaders / general / k8sContainer* / kubeApiserver* /
#      kubeControllerManager / kubelet / kubeProxy / kubePrometheus* / kubernetesApps /
#      kubernetesResources / kubernetesStorage / kubernetesSystem / kubeScheduler* /
#      kubeStateMetrics / network / node / nodeExporter* / prometheus / prometheusOperator / windows
#    （本机 downloads/kube-prometheus-stack-90.1.1.tgz 解压后可直接查 values.yaml 核对，
#      不要凭记忆写这些键名——这就是「配了却没生效」的典型来源）
#
#    实测后果：InfoInhibitor 一直在触发，而我们的根路由会把 severity=none 也收给邮件，
#    于是邮箱里多出一封 InfoInhibitor 噪声邮件。
#
# 正确做法（本项目的选择，规则一条都不删）：
#   · 「不该通知的告警」交给 Alertmanager 路由显式丢弃 —— 见
#     manifests/alerts/alertmanager-config.yaml 里 severity=none → receiver discard
#   · 为什么不图省事直接关闭整个规则文件：
#     general.rules 里除了 Watchdog / InfoInhibitor，还有 **TargetDown**（很关键的告警），
#     关掉整组会把 TargetDown 一起干掉
#   · CPUThrottlingHigh 特意保留：任务 8 压测时它能直接证明 Pod 被限流，是复盘的有力证据
# -----------------------------------------------------------------------------
defaultRules:
  create: true
  # 保留全部规则文件（不逐条禁用）
  # 另：defaultRules.customRules.<告警名>.severity 可以覆盖单条告警的 severity，
  #     需要改「级别」而不是「是否通知」时用它。
