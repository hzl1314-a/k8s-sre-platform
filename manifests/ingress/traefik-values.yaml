# =============================================================================
# Traefik Helm values —— 适配 chart 41.5.0（Traefik v3.7.13）
#
# 安装（在 k8s-cp 上，chart 与 values 都已 scp 上去）：
#   helm install traefik ./traefik-41.5.0.tgz \
#     -n traefik --create-namespace \
#     -f traefik-values.yaml
#
# 升级（改了本文件之后）：
#   helm upgrade traefik ./traefik-41.5.0.tgz -n traefik -f traefik-values.yaml
#
# ⚠️ 两处与老教程（chart 28.x 时代）的结构差异，本文件已按 41.5.0 修正：
#   1. Service 类型在 `service.spec.type`，**不是** `service.type`
#   2. 日志是顶层的 `log` / `accessLog`，**不是** `logs.general` / `logs.access`
#   照抄老版本 values 会因为字段不存在而被静默忽略（Service 会保持默认的
#   LoadBalancer，在自建集群里永远 Pending）。
# =============================================================================

# -----------------------------------------------------------------------------
# 镜像：显式指向镜像站
# chart 的默认值是 docker.io/traefik（见 templates/_helpers.tpl），
# 大陆 ECS 拉不动，而且实测 containerd 的 certs.d 镜像加速在本环境不生效
# （详见 docs/setup-cluster.md 3.2），所以这里必须写死。
# 该镜像走完整 token 流程实测过：HTTP 200，镜像站有缓存。
# -----------------------------------------------------------------------------
image:
  registry: docker.m.daocloud.io
  repository: library/traefik
  tag: v3.7.13
  pullPolicy: IfNotPresent

# Traefik Hub 是商业功能，开启后会额外拉 ghcr.io 的镜像。这里显式关闭。
hub:
  enabled: false

# -----------------------------------------------------------------------------
# 副本与调度：2 副本 + **required（硬）反亲和** + 控制面容忍
#
# ★ 2026-09-14 演练二复盘修复（chaos-drill.md 改进项 #5）：
#   此前是 preferred（软）反亲和——初始安装时确实分落 w1/w2，但演练一 drain w1 时，
#   控制面带 NoSchedule 污点进不去、当时唯一可调度节点只剩 w2，软反亲和让位，
#   替补落 w2；K8s 无自动 rebalance，双副本从此同节点。演练二 w2 关机时
#   入口层全灭（整站中断 6m18s，业务层却存活）。
#   修法两件套：
#     1. required：调度期强制不同节点——任一 worker 挂掉，另一节点副本必然存活
#     2. toleration：替补 Pod 可落控制面——故障期间保持 2 副本、零人工干预
#   （required 单独用也可消除全灭：另一半容量在存活节点继续服务，
#    因为 NodePort 全节点监听 + externalTrafficPolicy: Cluster）
# -----------------------------------------------------------------------------
deployment:
  replicas: 2

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: kubernetes.io/hostname
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik

# kubeadm 默认给控制面打 node-role.kubernetes.io/control-plane:NoSchedule，
# 不加容忍则故障替补只能 Pending 等节点回来（半容量扛过故障窗口）。
# 实验室 3 节点集群的取舍：入口组件请求量极小（100m/128Mi），值得换全容量自愈。
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

# -----------------------------------------------------------------------------
# 入口端口：绑定固定 NodePort
#
# 为什么用 NodePort 而不是 LoadBalancer：
#   大陆自建集群没有云厂商 LB 集成（ACK 才有 SLB 自动接管），
#   Service 类型为 LoadBalancer 的会永远 Pending。
#   公网 IP + 高位端口可零备案直接用，这是大陆环境的务实选择。
#
# NodePort 会在**每个节点**的该端口上监听，所以访问任意一台 ECS 的公网 IP
# 都能通 —— 这本身就是最朴素的入口高可用。
# -----------------------------------------------------------------------------
ports:
  web:
    port: 8000
    exposedPort: 80
    nodePort: 30080
    protocol: TCP
    expose:
      default: true
  websecure:
    port: 8443
    exposedPort: 443
    nodePort: 30443
    protocol: TCP
    expose:
      default: true
  # Dashboard 的 entryPoint（对应 ingressRoute.dashboard 的 entryPoints 配置）
  traefik:
    port: 8080
    exposedPort: 8080
    nodePort: 30800
    protocol: TCP
    expose:
      default: true

service:
  spec:
    type: NodePort
    # Cluster 策略：即使请求打到的节点上没有 Traefik 副本，kube-proxy 也会转发过去
    externalTrafficPolicy: Cluster

# -----------------------------------------------------------------------------
# Dashboard：通过 IngressRoute CRD 暴露在 :30800/dashboard/
# 面试可讲：Traefik 的路由配置走 CRD（IngressRoute/Middleware/TraefikService），
# 比标准 Ingress 表达力强（支持中间件链、加权分流、TCP/UDP 路由）
# -----------------------------------------------------------------------------
ingressRoute:
  dashboard:
    enabled: true

# -----------------------------------------------------------------------------
# Prometheus 指标：S3 可观测性阶段的数据源
# 业务层的 QPS / 5xx 错误率 / P95 延迟都从这里来
# （Online Boutique 自身不暴露 Prometheus 指标，只能从入口层观测）
#
# ⚠️ serviceMonitor 现在必须关闭！
#
# 它渲染的是一个 `monitoring.coreos.com/v1` 的 ServiceMonitor 对象，而这个 CRD
# 由 kube-prometheus-stack 提供 —— 监控栈要到任务 6 才装。CRD 不存在时
# helm 会直接报错中断安装：
#     Error: execution error at (traefik/templates/servicemonitor.yaml:5:10):
#            ERROR: You have to deploy monitoring.coreos.com/v1 first
#
# 所以顺序是：先关掉它把入口跑通（本阶段），等任务 6 装完 kube-prometheus-stack
# 再执行 `helm upgrade` 打开（升级命令见本文件开头）。
# Traefik 对外提供流量的能力与 ServiceMonitor 无关，关掉不影响任何验收项。
# -----------------------------------------------------------------------------
metrics:
  prometheus:
    # 这两个开关是「业务看板」的数据基础，不能省：
    #   addServicesLabels  -> traefik_service_requests_total 上才会有 service 标签，
    #                         才能按服务算 QPS / 5xx 错误率
    #   addEntryPointsLabels -> 入口层（web / websecure）维度的请求量
    # Online Boutique 自身不暴露 Prometheus 指标，业务层的 QPS / P95 / 错误率
    # 只能从入口层观测 —— 这也是这套监控设计里唯一能拿到「业务视角」的位置。
    addServicesLabels: true
    addEntryPointsLabels: true
    service:
      enabled: true
    serviceMonitor:
      # ★ 2026-09-13 任务 6 装完 kube-prometheus-stack 后改回 true
      #   （此前为 false：ServiceMonitor CRD 由 kps 提供，装之前渲染会失败）
      enabled: true
      interval: 30s
      additionalLabels:
        release: kube-prometheus-stack

# -----------------------------------------------------------------------------
# 日志：访问日志用于排查 4xx/5xx，也是 S3 阶段 Loki 的日志源
# -----------------------------------------------------------------------------
log:
  level: INFO

accessLog:
  enabled: true

# -----------------------------------------------------------------------------
# 资源限额：入口组件是流量必经之路，给足但设上限
# -----------------------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# 高负载下默认探针可能误判，放宽阈值
livenessProbe:
  failureThreshold: 3
  initialDelaySeconds: 10
  periodSeconds: 10
readinessProbe:
  failureThreshold: 3
  initialDelaySeconds: 10
  periodSeconds: 10
